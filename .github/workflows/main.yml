name: Build and Deploy MAYRA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate project from Bundel.text.py
        run: python Bundel.text.py mayra
      - name: Set Firebase project id
        run: echo '{"projects":{"default":"mayra-abdea"}}' > mayra/.firebaserc
      - name: Inject Firebase web config
        env:
          CFG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: printf 'export const firebaseConfig = %s;\n' "$CFG" > mayra/public/js/firebase-config.js
      - name: Check service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret খালি বা নেই"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          python -c "import json,sys;d=json.load(open(sys.argv[1]));print('OK project:',d.get('project_id'),'| type:',d.get('type'),'| has_key:',bool(d.get('private_key')))" "$RUNNER_TEMP/sa.json" || { echo "ERROR: JSON ঠিক নেই (পুরোটা কপি হয়নি)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g firebase-tools
      - name: Deploy hosting and database rules
        working-directory: mayra
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only hosting,database --project mayra-abdea --non-interactive
