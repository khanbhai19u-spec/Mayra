name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate project from Bundel.text.py
        run: python Bundel.text.py mayra
      - name: Inject Firebase web config
        env:
          CFG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: printf 'export const firebaseConfig = %s;\n' "$CFG" > mayra/public/js/firebase-config.js
      - name: Patch code for native Android (voice + login)
        run: |
          python - <<'PY'
          import pathlib
          d = pathlib.Path('mayra/public/js')
          def rep(s, a, b):
              assert a in s, 'patch target missing: ' + a[:50]
              return s.replace(a, b, 1)
          v = (d / 'voice.js').read_text(encoding='utf-8')
          v = rep(v, 'export const supported = {sr: !!SR,', 'export const supported = {sr: !!SR || !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()),')
          v = rep(v, 'export function listen(lang) {', 'function listenWeb(lang) {')
          v = rep(v, 'export const stopListen = () => { try { cur && cur.abort(); } catch {} };', 'export const stopListen = () => { try { cur && cur.abort(); } catch {} try { window.Capacitor.Plugins.SpeechRecognition.stop(); } catch {} };')
          v += '\n' + '\n'.join([
              "export async function listen(lang) {",
              "  const C = window.Capacitor;",
              "  const N = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.SpeechRecognition;",
              "  if (!N) return listenWeb(lang);",
              "  const p = await N.requestPermissions();",
              "  if (p && p.speechRecognition && p.speechRecognition !== 'granted') throw new Error('mic/speech permission denied');",
              "  const r = await N.start({language: lang || S.lang || 'bn-BD', maxResults: 1, partialResults: false, popup: false});",
              "  return (r && r.matches && r.matches[0]) || '';",
              "}",
          ]) + '\n'
          (d / 'voice.js').write_text(v, encoding='utf-8')
          a = (d / 'app.js').read_text(encoding='utf-8')
          a = rep(a, '$("#g").onclick = () => A.google().catch(e => toast(e.message));', 'if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) $("#g").remove(); else $("#g").onclick = () => A.google().catch(e => toast(e.message));')
          (d / 'app.js').write_text(a, encoding='utf-8')
          print('patched OK')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        working-directory: mayra
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/speech-recognition@6
          echo '{"appId":"app.mayra.assistant","appName":"MAYRA","webDir":"public","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        working-directory: mayra/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MAYRA APK ${{ github.run_number }}
          files: mayra/android/app/build/outputs/apk/debug/app-debug.apk
